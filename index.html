
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Mining Crypto</title>
    <!-- Script Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1c1c1e; color: white; text-align: center; padding: 20px; }
        .coin { font-size: 50px; margin: 20px; }
        button { background-color: #2ea6ff; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 18px; cursor: pointer; }
        button:active { background-color: #1c8adb; }
    </style>
</head>
<body>
    <h1>⛏️ Free Mining Crypto</h1>
    <div class="coin">🪙</div>
    <h2 id="balance">Saldo: 0 Koin</h2>
    <button onclick="mineCoin()">Mulai Mining</button>

    <script>
        // Inisialisasi Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Memperluas layar penuh

        let balance = 0;

        function mineCoin() {
            balance += 10;
            document.getElementById('balance').innerText = 'Saldo: ' + balance + ' Koin';
            // Efek getar di HP
            tg.HapticFeedback.impactOccurred('medium');
        }
    </script>
</body>
  </html>
